<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8c291"/>
      <stop offset="100%" stop-color="#e58e26"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Decorative Orbit / Halo -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="200" cy="200" r="168" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 8" opacity="0.25"/>

  <!-- Code Floating Elements -->
  <g opacity="0.6">
    <rect x="42" y="60" width="70" height="28" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="77" y="78" font-family="'JetBrains Mono', monospace" font-size="12" fill="#60a5fa" text-anchor="middle">&lt;code/&gt;</text>

    <rect x="290" y="70" width="68" height="28" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="324" y="88" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399" text-anchor="middle">{ full_stack }</text>

    <rect x="40" y="320" width="60" height="26" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="70" y="337" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c084fc" text-anchor="middle">LPU '29</text>

    <rect x="295" y="315" width="65" height="26" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="327" y="332" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" text-anchor="middle">CSE Core</text>
  </g>

  <!-- Developer Silhouette / Avatar Character -->
  <path d="M100 370 C100 300, 140 270, 200 270 C260 270, 300 300, 300 370 Z" fill="url(#hoodieGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Hoodie inner neckline & zipper accent -->
  <path d="M175 272 L200 315 L225 272" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <line x1="200" y1="315" x2="200" y2="370" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Neck -->
  <rect x="184" y="225" width="32" height="40" rx="8" fill="#d97706" opacity="0.85"/>

  <!-- Head Base -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="#f59e0b" opacity="0.9"/>

  <!-- Stylish Hair -->
  <path d="M142 165 C140 120, 170 105, 200 105 C235 105, 260 125, 258 165 C245 140, 230 135, 200 135 C170 135, 155 145, 142 165 Z" fill="#0f172a"/>
  <path d="M150 145 C170 120, 220 120, 250 138 C235 125, 195 120, 150 145 Z" fill="#1e293b"/>

  <!-- Modern Smart Glasses -->
  <g stroke="#38bdf8" stroke-width="3" fill="#0f172a" fill-opacity="0.6">
    <rect x="160" y="165" width="34" height="24" rx="6"/>
    <rect x="206" y="165" width="34" height="24" rx="6"/>
    <line x1="194" y1="175" x2="206" y2="175"/>
    <line x1="145" y1="172" x2="160" y2="175"/>
    <line x1="240" y1="175" x2="255" y2="172"/>
  </g>

  <!-- Friendly Smile -->
  <path d="M188 215 Q200 225 212 215" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Glowing Initial / Badge -->
  <circle cx="200" cy="50" r="24" fill="url(#accentGrad)" filter="url(#subtleGlow)"/>
  <text x="200" y="58" font-family="'Inter', sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">SK</text>
</svg>
